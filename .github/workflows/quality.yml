name: Pull request quality checks

on:
  pull_request:
    branches: ['main-/-(root)']
  push:
    branches: ['security/role-permissions-audit-2026-11-21']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check cloud-auth.js
          node --check uzbek.js
          node --check scripts/quality-check.cjs
      - name: Run quality and security checks
        run: node scripts/quality-check.cjs
